<!DOCTYPE html>
<html>
<head>
    <title>USB设备列表</title>
    <meta charset="utf-8">
</head>
<body>
    <button onclick="getUSBDevices()">获取USB设备</button>
    <div id="deviceAlert" style="color: red;"></div>
    <div id="deviceList"></div>
    <script>
        async function getUSBDevices() {
            try {
                const device = await navigator.usb.requestDevice({
                    filters: [{ vendorId: 0x5a9 }]
                });
                
                // 清除提示信息
                document.getElementById('deviceAlert').textContent = '';
                
                // 显示设备信息
                const deviceList = document.getElementById('deviceList');
                deviceList.innerHTML = '';
                displayDeviceInfo(device);
            } catch (error) {
                console.error('获取USB设备失败:', error);
                document.getElementById('deviceAlert').textContent = '获取USB设备失败';
            }
        }

        // 页面加载完成后自动检测USB设备
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                console.log('USB设备检测已启动');

                // 获取当前已连接的设备列表用于调试
                const allDevices = await navigator.usb.getDevices();
                console.log('当前已连接的所有USB设备:', allDevices);

                // 获取之前已授权的目标设备
                const targetDevices = await navigator.usb.getDevices({
                    filters: [{ vendorId: 0x5a9 }]
                });
                console.log('当前已连接的目标设备:', targetDevices);

                // 保存已授权设备的信息
                targetDevices.forEach(device => {
                    displayDeviceInfo(device);
                });

                // 监听USB设备移除
                navigator.usb.addEventListener('disconnect', event => {
                    if (event.device.vendorId === 0x5a9) {
                        console.log('目标USB设备已断开');
                        removeDeviceInfo(event.device);
                    }
                });

            } catch (error) {
                console.error('USB设备检测初始化失败:', error);
            }
        });

        // 显示设备信息的函数
        function displayDeviceInfo(device) {
            const deviceList = document.getElementById('deviceList');
            const deviceInfo = document.createElement('div');
            deviceInfo.setAttribute('data-device-id', `${device.vendorId}-${device.productId}`);
            deviceInfo.innerHTML = `
                Vendor ID: 0x${device.vendorId.toString(16)}<br>
                ProductID: 0x${device.productId.toString(16)}
            `;
            deviceList.appendChild(deviceInfo);
        }

        // 移除设备信息的函数
        function removeDeviceInfo(device) {
            const deviceId = `${device.vendorId}-${device.productId}`;
            const deviceElement = document.querySelector(`[data-device-id="${deviceId}"]`);
            if (deviceElement) {
                deviceElement.remove();
            }
        }
    </script>
</body>
</html>
